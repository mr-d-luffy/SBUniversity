[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbuniversity-api"
version = "0.1.0"
description = "Production Ready Backend for SiliconBrains University"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.1",
    "httpx>=0.27.2",
    "svix>=1.36.0",
    "google-genai>=0.1.1",
    "reportlab>=4.2.5",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.4.0",
    "supabase>=2.8.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.9",
    "black>=24.8.0",
]
